---
name: Oh My Vibe
description: "Run Oh My Vibe in a GitHub Actions workflow"
author: Oh My Vibe contributors

inputs:
  prompt:
    description: The prompt to pass to the agent
    required: true
    default: |
      You are a helpful assistant
  MISTRAL_API_KEY:
    description: API key for the configured provider
    required: true
  install_python:
    description: |
      Whether or not to install Python
    required: true
    default: "true"
  python_version:
    description: |
      Version of Python to install. Warning: Unsupported.
    required: false

runs:
  using: "composite"
  steps:
    - name: Install Required Python Version
      if: inputs.install_python == true
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version-file: ${{ github.action_path }}/.python-version

    - name: Install Requested Python Version
      if: inputs.install_python && inputs.python_version
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

    - name: Install Oh My Vibe
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        uv sync --locked --all-extras --dev

    - name: Run Oh My Vibe
      id: run-oh-my-vibe
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        MISTRAL_API_KEY: "${{ inputs.MISTRAL_API_KEY }}"
        PROMPT_INPUT: "${{ inputs.prompt }}"
      run: |
        cd "${{ github.workspace }}"
        uv run --directory "${{ github.action_path }}" omv \
          -p "$PROMPT_INPUT"
